services:
  postgres:
    image: postgres:16-alpine
    container_name: finflow-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finflow_ai
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
