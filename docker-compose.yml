version: "3.9"

services:
  backend:
    build:
      context: ./finflow-ai/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: sqlite:////data/finflow.db
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:80,http://frontend
      SECRET_KEY: ${SECRET_KEY:-change-me-in-docker-compose}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - finflow_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finflow_data:
