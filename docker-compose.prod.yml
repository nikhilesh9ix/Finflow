# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (set via CI secrets or .env):
#   SECRET_KEY, GROQ_API_KEY or ANTHROPIC_API_KEY, MONGO_PASSWORD


services:
  mongo:
    # Production runs with authentication on.
    environment:
      MONGO_INITDB_ROOT_USERNAME: finflow
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    environment:
      APP_ENV: production
      MONGODB_URL: mongodb://finflow:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    deploy:
      resources:
        limits:
          memory: 128M
